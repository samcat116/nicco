name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Read-only Linux smoke test
        run: |
          cargo run --locked -p nicco -- status --json > "$RUNNER_TEMP/nicco-status.json"
          python3 - "$RUNNER_TEMP/nicco-status.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              snapshot = json.load(stream)
          assert snapshot['schema_version'] == 1
          assert snapshot['source'] == 'live'
          assert any(interface['name'] == 'lo' for interface in snapshot['interfaces'])
          assert all(interface['owner'] is None for interface in snapshot['interfaces'])
          PY
